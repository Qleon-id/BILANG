name: Build BILANG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'BILANG*.zip' -print | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "BILANG project ZIP not found in repository root."
            exit 1
          fi

          echo "Using: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        working-directory: project
        run: flutter create --platforms=android .

      - name: Configure Android speech recognition
        working-directory: project
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
          ]

          for line in permissions:
              if line not in s:
                  s = s.replace('<application', line + '\n\n    <application', 1)

          queries = '''    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n'''
          if 'android.speech.RecognitionService' not in s:
              s = s.replace('<application', queries + '    <application', 1)

          p.write_text(s)
          PY

          echo "=== AndroidManifest speech configuration ==="
          cat "$MANIFEST"

      - name: Generate BILANG Android launcher icon
        working-directory: project
        run: dart run flutter_launcher_icons

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Analyze BILANG source
        working-directory: project
        run: flutter analyze lib

      - name: Build Android APK
        working-directory: project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilang-debug-apk
          path: project/build/app/outputs/flutter-apk/app-debug.apk
          
