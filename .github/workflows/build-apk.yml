name: Build BILANG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest BILANG project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'BILANG*.zip' -print | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "BILANG project ZIP not found in repository root."
            exit 1
          fi

          echo "Using latest ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d project

          if [ ! -f project/pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found at project root."
            echo "ZIP structure:"
            find project -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          echo "BILANG project detected successfully."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        working-directory: project
        run: flutter create --platforms=android .

      - name: Configure Android speech recognition
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
          ]

          for line in permissions:
              if line not in s:
                  s = s.replace(
                      '<application',
                      line + '\n\n    <application',
                      1
                  )

          queries = '''    <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>

          '''

          if 'android.speech.RecognitionService' not in s:
              s = s.replace(
                  '<application',
                  queries + '    <application',
                  1
              )

          p.write_text(s)
          PY

          echo "Speech recognition configuration applied."

      - name: Configure Android Gradle compatibility
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          if p.exists():
              s = p.read_text()
          else:
              s = ""

          flags = [
              "android.newDsl=false",
              "android.builtInKotlin=false",
          ]

          for flag in flags:
              key = flag.split("=")[0]

              if not any(line.startswith(key + "=") for line in s.splitlines()):
                  if s and not s.endswith("\n"):
                      s += "\n"
                  s += flag + "\n"

          p.write_text(s)
          PY

          echo "=== gradle.properties ==="
          cat android/gradle.properties

      - name: Configure core library desugaring
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          build_file = next((p for p in candidates if p.exists()), None)

          if build_file is None:
              raise SystemExit("Android app Gradle file not found.")

          s = build_file.read_text()

          if build_file.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  marker = "compileOptions {"
                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + "\n        isCoreLibraryDesugaringEnabled = true",
                          1
                      )

              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
                  if "dependencies {" in s:
                      s = s.replace(
                          "dependencies {",
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          1
                      )
                  else:
                      s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          else:
              if "isCoreLibraryDesugaringEnabled" not in s:
                  marker = "compileOptions {"
                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + "\n        coreLibraryDesugaringEnabled true",
                          1
                      )

              if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'" not in s:
                  if "dependencies {" in s:
                      s = s.replace(
                          "dependencies {",
                          "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                          1
                      )
                  else:
                      s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

          build_file.write_text(s)

          print(f"Configured: {build_file}")
          PY

          echo "=== Verify desugaring ==="
          grep -R "desugar_jdk_libs" android/app || true
          grep -R "CoreLibraryDesugaringEnabled\|coreLibraryDesugaringEnabled" android/app || true

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Verify Flutter dependencies
        working-directory: project
        shell: bash
        run: |
          echo "=== Notification dependencies ==="
          grep -n "flutter_local_notifications:" pubspec.yaml
          grep -n "timezone:" pubspec.yaml
          grep -n "flutter_timezone:" pubspec.yaml

          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            echo "ERROR: flutter_launcher_icons should not be used in this milestone."
            exit 1
          fi

          echo "Launcher icon generation intentionally skipped."

      - name: Analyze BILANG source
        working-directory: project
        run: flutter analyze lib

      - name: Build Android APK
        working-directory: project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilang-debug-apk
          path: project/build/app/outputs/flutter-apk/app-debug.apk
