name: Extract BILANG Flutter ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract BILANG ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found. Nothing to extract."
            exit 0
          fi

          echo "Found: $ZIP_FILE"

          rm -rf _bilang_extract
          mkdir -p _bilang_extract

          unzip -o "$ZIP_FILE" -d _bilang_extract

          # If the ZIP contains one top-level folder, use its contents.
          shopt -s dotglob nullglob
          ITEMS=(_bilang_extract/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE_DIR="${ITEMS[0]}"
          else
            SOURCE_DIR="_bilang_extract"
          fi

          # Copy project files/folders to repository root.
          cp -a "$SOURCE_DIR"/. .

          # Remove the temporary ZIP/extraction folder.
          rm -rf _bilang_extract "$ZIP_FILE"

      - name: Commit extracted Flutter project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract BILANG Flutter project"
          git push
          
