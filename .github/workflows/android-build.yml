name: Build BILANG Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "bilang-project.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project temporarily
        run: |
          rm -rf /tmp/bilang-project
          mkdir -p /tmp/bilang-project
          unzip -q bilang-project.zip -d /tmp/bilang-project

      - name: Locate Flutter project
        run: |
          if [ -f "/tmp/bilang-project/pubspec.yaml" ]; then
            echo "PROJECT_DIR=/tmp/bilang-project" >> "$GITHUB_ENV"
          elif [ -f "/tmp/bilang-project/build41/pubspec.yaml" ]; then
            echo "PROJECT_DIR=/tmp/bilang-project/build41" >> "$GITHUB_ENV"
          else
            echo "pubspec.yaml tidak ditemukan di ZIP."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name bilang .
          fi
          rm -f test/widget_test.dart

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter test
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilang-android-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
