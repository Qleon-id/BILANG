name: Validate BILANG Project ZIP

on:
  push:
    paths:
      - "bilang-project.zip"
      - ".github/workflows/bilang.yml"
  workflow_dispatch:

jobs:
  validate-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check BILANG ZIP
        run: |
          if [ ! -f "bilang-project.zip" ]; then
            echo "bilang-project.zip tidak ditemukan."
            exit 1
          fi

          echo "Memeriksa ZIP tanpa mengekstraknya..."
          unzip -t "bilang-project.zip"

          echo "ZIP BILANG valid."
          echo "Workflow selesai. ZIP tidak diekstrak dan tidak diubah."
          
